<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecionando · Bernardo Iannini</title>
  <!-- Esta página existia para servir posts via ?slug=...
       A nova versão pré-renderiza cada post em /posts/<slug>.html.
       Mantida como redirect pra preservar links indexados. -->
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://bernardoiannini.com/blog.html" />
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var slug = params.get('slug') || params.get('post') || params.get('id');
      if (slug) {
        // Sanitiza o slug pra evitar open-redirect via aspas/quebras
        slug = String(slug).replace(/[^a-zA-Z0-9_-]/g, '');
      }
      if (!slug) { location.replace('/blog.html'); return; }
      var destino = '/posts/' + slug + '.html';
      // Verifica se o post existe antes de redirecionar;
      // slug de post removido ou typo cai no blog em vez do 404 cru do host
      fetch(destino, { method: 'HEAD' })
        .then(function (res) { location.replace(res.ok ? destino : '/blog.html'); })
        .catch(function () { location.replace('/blog.html'); });
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/blog.html"></noscript>
</head>
<body>
  <p>Redirecionando para o <a href="/blog.html">blog</a>...</p>
</body>
</html>
