<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-pc-doctitle>Case Study — Bernardo Iannini</title>
  <meta name="author" content="Bernardo Iannini">
  <meta name="description" data-pc-docdesc content="Case study — Bernardo Iannini, Full Stack Developer &amp; AI Designer, Belo Horizonte." />
  <!-- Shell LEGADO: cada projeto agora tem URL propria em /projetos/<slug>.html
     (o vercel.json faz 301 de ?slug=X). Sem slug esta pagina renderiza um
     template vazio com <h1>Loading...</h1>, que e conteudo fino: noindex. -->
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;600;700&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/style.css">

  <!-- Favicon padrão (aba do navegador) -->
  <link rel="icon" type="image/png" href="./favicon.png" sizes="32x32">
  <link rel="icon" type="image/png" href="./favicon-48.png" sizes="48x48">
  <link rel="icon" type="image/png" href="./favicon_192px.png" sizes="192x192">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any">
  <meta name="theme-color" content="#000000">

  <link rel="canonical" href="https://www.bernardoiannini.com/project.html" />

  <!-- =================================================================
       ANTI-FLICKER de i18n + transição entre páginas (idêntico ao index)
       ================================================================= -->
  <style id="page-fx">
    html:not(.i18n-ready) body { opacity: 0; }
    body {
      opacity: 1;
      transition: opacity .35s cubic-bezier(.22,.61,.36,1);
    }
    html:not(.i18n-ready) main {
      transform: scale(1.03);
      filter: blur(8px);
    }
    main {
      transition:
        transform .45s cubic-bezier(.22,.61,.36,1),
        filter .45s cubic-bezier(.22,.61,.36,1);
    }
    body.page-leaving { opacity: 0; pointer-events: none; }
    body.page-leaving main {
      transform: scale(.97);
      filter: blur(8px);
    }
    </style>
  <script>
    (function () {
      try {
        var l = localStorage.getItem('lang');
        if (l === 'pt' || l === 'en') {
          document.documentElement.lang = (l === 'pt') ? 'pt-BR' : 'en';
        }
      } catch (e) {}
      /* PAINT LIBERADO SEMPRE (ver index.html): antes a classe so era
         adicionada quando havia idioma salvo, entao visitante novo e crawler
         encaravam tela branca ate executar o language.js. Sem preferencia
         salva o HTML ja esta no idioma default, logo nao ha texto pra piscar.
         FORA do try de proposito: se o localStorage lancar (modo privado com
         storage bloqueado), o catch engoliria o add e a pagina ficaria
         invisivel justamente no navegador mais restritivo. */
      document.documentElement.classList.add('i18n-ready');
    })();
    window.addEventListener('pageshow', function () {
      document.body && document.body.classList.remove('page-leaving');
    });
  </script>

  <!-- Open Graph / Twitter (genéricos — o slug real ainda não é
       pré-renderizado no servidor, então isto é um fallback razoável) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Bernardo Iannini" />
  <meta property="og:title" content="Case Study — Bernardo Iannini" />
  <meta property="og:description" content="Case study of a project by Bernardo Iannini." />
  <meta property="og:image" content="https://www.bernardoiannini.com/img/eufoto1.png" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:locale:alternate" content="en_US" />
  <meta name="twitter:card" content="summary_large_image" />
</head>

<body>
  <!-- Skip-link -->
  <a class="skip-link" href="#pcMain" data-i18n="a11y.skip">Skip to content</a>

  <!-- NAVBAR — idêntico ao index.html: mesmos IDs, mesmo UI.js cuida
       de tudo (menu mobile, dropdown Work, language switch). -->
  <header>
    <div class="nav">

      <!-- MENU MOBILE (drop) -->
      <nav id="mobileNav" class="mobile-nav" aria-hidden="true">
        <a href="#home" data-scroll data-i18n="nav.home">Home</a>
        <a href="#sobre" data-scroll data-i18n="nav.about">About</a>
        <a href="#services" data-scroll data-i18n="nav.services">Services</a>

        <div class="mobile-dd">
          <button type="button" class="mobile-dd-btn" aria-haspopup="menu" aria-expanded="false">
            <span data-i18n="nav.work">Work</span>
            <svg class="mobile-dd-caret" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="mobile-dd-menu" role="menu">
            <a href="#xp" data-scroll data-i18n="nav.experience" role="menuitem">Experience</a>
            <a href="#skills" data-scroll data-i18n="nav.skills" role="menuitem">Skills</a>
            <a href="#projects" data-scroll data-i18n="nav.projects" role="menuitem">Projects</a>
          </div>
        </div>

        <a href="/blog.html" class="nav-blog-link"><span data-i18n="nav.blog">Blog</span></a>
        <a href="#contato" data-scroll data-i18n="nav.contact">Contact</a>
      </nav>

      <!-- Language switch (ESQUERDA) -->
      <div class="lang-slot" aria-label="Language switch">
        <button id="langBtn" class="lang-switch pill" aria-haspopup="listbox" aria-expanded="false">
          <span class="lang-ico" aria-hidden="true">🌐</span>
          <span id="langCode">EN</span>
          <svg class="caret" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <ul id="langMenu" class="lang-menu" role="listbox" aria-label="Language / Idioma">
          <li data-lang="en" role="option" tabindex="0" aria-selected="true">English</li>
          <li data-lang="pt" role="option" tabindex="0" aria-selected="false">Português</li>
        </ul>
      </div>

      <div class="nav-center">
        <nav class="pill">
          <a href="#home" data-scroll data-i18n="nav.home">Home</a>
          <a href="#sobre" data-scroll data-i18n="nav.about">About</a>
          <a href="#services" data-scroll data-i18n="nav.services">Services</a>

          <div class="nav-dd">
            <button type="button" id="workBtn" class="nav-dd-btn" aria-haspopup="menu" aria-expanded="false">
              <span data-i18n="nav.work">Work</span>
              <svg class="nav-dd-caret" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
            <ul id="workMenu" class="nav-dd-menu" role="menu">
              <li><a href="#xp" data-scroll data-i18n="nav.experience" role="menuitem">Experience</a></li>
              <li><a href="#skills" data-scroll data-i18n="nav.skills" role="menuitem">Skills</a></li>
              <li><a href="#projects" data-scroll data-i18n="nav.projects" role="menuitem">Projects</a></li>
            </ul>
          </div>

          <a href="/blog.html" class="nav-blog-link"><span data-i18n="nav.blog">Blog</span></a>
          <a href="#contato" data-scroll data-i18n="nav.contact">Contact</a>
        </nav>
      </div>

      <!-- BOTÃO HAMBÚRGUER (aparece no mobile) -->
      <button id="menuBtn" class="menu-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="mobileNav">
        <span class="menu-line"></span>
        <span class="menu-line"></span>
        <span class="menu-line"></span>
      </button>

      <!-- NAV RIGHT (desktop) -->
      <div class="nav-right">
        <a class="resume-btn" href="Curriculo_Bernardo_Iannini.pdf" download>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3v11m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
          <span data-i18n="nav.resume">Currículo</span>
        </a>
      </div>

    </div>
  </header>

  <!-- ============================================================
       CASE STUDY DE UM PROJETO — populado por js/project-case.js a
       partir de I18N[lang].projects.list, lendo ?slug= da URL.
       ============================================================ -->
  <main id="pcMain" class="cs" data-pc-root data-pc-redirect>
    <!-- rota antiga: js/project-case.js manda pra /projetos/<slug>.html
         (a Vercel já faz o 301 no servidor). O conteúdo de cada projeto é
         gerado no build por scripts/build-projects.js. -->
    <p class="cs-lead"><a href="/#projects">Projects</a></p>
  </main>

  <!-- language.js + project-case.js (define renderProjectCase) PRECISAM
       carregar ANTES do UI.js — o init() do UI.js chama applyI18n(LANG)
       de forma síncrona assim que carrega (mesmo padrão do index.html,
       onde as seções também vêm antes do UI.js). -->
  <script src="/js/language.js" defer></script>
  <script src="/js/project-case.js" defer></script>
  <script src="/js/UI.js" defer></script>

</body>

</html>
